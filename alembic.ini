# alembic.ini — ЧАСТЬ 4

[alembic]
# Путь к папке с миграциями в вашем репозитории
script_location = alembic

# Важно: используем асинхронный драйвер postgresql+asyncpg
# Параметры здесь указываются дефолтные, так как в alembic/env.py 
# мы уже написали динамическую подстановку из .env (помните страницу 2 вашего PDF?)
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
